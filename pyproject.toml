[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ocode"
version = "0.1.0"
description = "A smart, Odoo-aware code editor for the terminal"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ocode contributors" }]
keywords = ["odoo", "editor", "tui", "textual"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
  "Topic :: Terminals",
  "Topic :: Text Editors",
]
dependencies = [
  "textual>=0.86",
  "rich>=13.0",
  "typing-extensions>=4.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
lint = ["pylint-odoo", "ruff"]
lsp = ["python-lsp-server"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-benchmark", "hypothesis", "ruff", "mypy"]
all = ["ocode[lint]", "ocode[lsp]"]

[project.scripts]
ocode = "ocode.__main__:main"

[project.urls]
Homepage = "https://github.com/example/ocode"
Issues = "https://github.com/example/ocode/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ocode"]

[tool.hatch.build.targets.sdist]
packages = ["src/ocode"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
show_error_codes = true
plugins = []
[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = false
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["ocode"]
branch = true
